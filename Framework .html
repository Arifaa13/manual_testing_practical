<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лист данных ручного тестирования — форма</title>

    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-0: #0e0a08;
            --panel: rgba(26, 20, 16, 0.72);
            --line: rgba(255, 209, 102, 0.14);
            --line-strong: rgba(255, 209, 102, 0.32);
            --gold: #FFD166;
            --gold-soft: #E8C07A;
            --amber: #E0A458;
            --text: #F3EAE0;
            --muted: #B9A897;
            --danger: #E5484D;
            --success: #2FBF71;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            padding: 28px 18px 60px;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(160deg, #2a1a10 0%, #120d0a 45%, #1b0f0d 100%);
            -webkit-font-smoothing: antialiased;
        }

        #bg-gl {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            display: block;
        }

        .container-fluid {
            position: relative;
            max-width: 1500px;
            margin: 0 auto;
            padding: 36px 36px 44px;
            background: var(--panel);
            backdrop-filter: blur(14px) saturate(120%);
            -webkit-backdrop-filter: blur(14px) saturate(120%);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, .55),
                inset 0 1px 0 rgba(255, 255, 255, .04);
        }

        .container-fluid::before {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 2px;
            border-radius: 18px 18px 0 0;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: .55;
        }

        h1 {
            margin: 0 0 28px;
            text-align: center;
            font-size: clamp(1.4rem, 2.2vw, 2rem);
            font-weight: 800;
            letter-spacing: .01em;
            background: linear-gradient(180deg, #FFF1CC, var(--gold) 55%, var(--amber));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            filter: drop-shadow(0 2px 18px rgba(255, 180, 80, .25));
        }

        form > h1 {
            text-align: left;
            font-size: 1.1rem;
            letter-spacing: .04em;
            text-transform: uppercase;
            margin: 38px 0 16px;
            padding-left: 14px;
            border-left: 3px solid var(--gold);
            filter: none;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 18px;
        }

        .field-full { grid-column: 1 / -1; }

        @media (max-width: 720px) {
            .field-grid { grid-template-columns: 1fr; }
        }

        .field {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        label {
            margin-bottom: 6px;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--gold-soft);
        }

        label strong { font-weight: 700; }

        .form-control {
            width: 100%;
            padding: .55rem .75rem;
            background: rgba(12, 9, 7, 0.55);
            border: 1px solid var(--line);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: .9rem;
            line-height: 1.45;
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .form-control::placeholder { color: rgba(200, 180, 160, .4); }

        .form-control:hover:not(:focus) { border-color: rgba(255, 209, 102, .25); }

        .form-control:focus {
            outline: none;
            background: rgba(18, 13, 10, .82);
            border-color: var(--gold);
            box-shadow:
                0 0 0 .2rem rgba(255, 209, 102, .16),
                0 0 22px rgba(255, 180, 80, .12);
            color: #fff;
        }

        textarea.form-control { resize: vertical; min-height: 44px; }
        select.form-control { cursor: pointer; }
        select.form-control option { background: #1a1410; color: var(--text); }

        input[type="file"].form-control-file {
            width: 100%;
            font-size: .74rem;
            color: var(--muted);
        }

        input[type="file"]::file-selector-button {
            margin-right: 8px;
            padding: 5px 10px;
            font-size: .74rem;
            font-weight: 700;
            color: var(--gold);
            background: rgba(255, 209, 102, .12);
            border: 1px solid rgba(255, 209, 102, .35);
            border-radius: 7px;
            cursor: pointer;
            transition: background .18s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255, 209, 102, .26);
        }

        .file-status {
            display: block;
            margin-top: 6px;
            font-size: .72rem;
            line-height: 1.25;
            color: #7EE2A8;
            word-break: break-word;
        }

        /* Превью загруженного скриншота в таблице */
        .screenshot-preview { margin-top: 6px; }
        .screenshot-preview img {
            display: block;
            max-width: 100%;
            max-height: 90px;
            border-radius: 6px;
            border: 1px solid rgba(255, 209, 102, .35);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .35);
        }

        .table-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 26px 0 14px;
        }

        .add-button,
        .clear-button,
        .btn-download,
        input[type="submit"].btn-success {
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font-family: inherit;
            font-size: .86rem;
            font-weight: 700;
            letter-spacing: .02em;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .2s ease, filter .2s ease,
                        background .2s ease, color .2s ease, border-color .2s ease;
        }

        .add-button {
            color: #2a1a0a;
            background: linear-gradient(180deg, #FFD98A, var(--amber));
            box-shadow:
                0 8px 22px rgba(224, 164, 88, .28),
                inset 0 1px 0 rgba(255, 255, 255, .5);
        }

        .add-button:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
            box-shadow:
                0 12px 28px rgba(224, 164, 88, .38),
                inset 0 1px 0 rgba(255, 255, 255, .6);
        }

        .add-button:active { transform: translateY(0); }

        .clear-button {
            color: var(--muted);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, .14);
        }

        .clear-button:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, .3);
            background: rgba(255, 255, 255, .05);
        }

        input[type="submit"].btn-success {
            width: 100%;
            margin-top: 30px;
            padding: 14px 18px;
            color: #06130b;
            font-weight: 800;
            background: linear-gradient(180deg, #43D68A, var(--success));
            box-shadow:
                0 10px 26px rgba(47, 191, 113, .25),
                inset 0 1px 0 rgba(255, 255, 255, .35);
        }

        input[type="submit"].btn-success:hover {
            filter: brightness(1.07);
            transform: translateY(-1px);
        }

        .btn-download {
            display: block;
            margin: 22px auto 0;
            padding: 12px 22px;
            color: #06130b;
            background: linear-gradient(180deg, #43D68A, var(--success));
            box-shadow: 0 10px 26px rgba(47, 191, 113, .25);
        }

        .btn-download:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
        .btn-download:disabled { opacity: .55; cursor: not-allowed; }

        .remove-button {
            width: 100%;
            padding: 7px 10px;
            font-size: .76rem;
            font-weight: 700;
            color: #FF9AA0;
            background: transparent;
            border: 1px solid rgba(229, 72, 77, .45);
            border-radius: 8px;
            cursor: pointer;
            transition: background .18s ease, color .18s ease, border-color .18s ease;
        }

        .remove-button:hover:not(:disabled) {
            color: #fff;
            background: rgba(229, 72, 77, .16);
            border-color: rgba(229, 72, 77, .8);
        }

        .remove-button:disabled { opacity: .4; cursor: not-allowed; }

        .table-responsive {
            overflow-x: auto;
            overflow-y: hidden;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(10, 8, 6, .35);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 209, 102, .35) transparent;
        }

        .summary-table {
            width: 100%;
            min-width: 1250px;
            margin: 0;
            border-collapse: separate;
            border-spacing: 0;
            font-size: .85rem;
            color: var(--text);
        }

        .summary-table th {
            padding: 12px 8px;
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--gold-soft);
            background: linear-gradient(180deg, #2a201a, #1d1611);
            border-bottom: 1px solid var(--line-strong);
            border-right: 1px solid rgba(255, 255, 255, .04);
            white-space: normal;
            vertical-align: middle;
            text-align: center;
        }

        .summary-table td {
            padding: 8px;
            text-align: center;
            vertical-align: top;
            border-bottom: 1px solid rgba(255, 255, 255, .05);
            border-right: 1px solid rgba(255, 255, 255, .03);
        }

        .summary-table tbody tr { transition: background .15s ease; }
        .summary-table tbody tr:nth-child(even) { background: rgba(255, 255, 255, .018); }
        .summary-table tbody tr:hover { background: rgba(255, 209, 102, .05); }
        .summary-table tbody tr:nth-child(even):hover { background: rgba(255, 209, 102, .065); }

        .summary-table .row-number {
            padding-top: 14px;
            font-weight: 800;
            color: var(--gold-soft);
        }

        .summary-table textarea.form-control { font-size: .8rem; min-height: 40px; }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        @media (max-width: 720px) {
            .counter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        .counter {
            padding: .4rem .5rem;
            min-height: 0;
            resize: none;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--gold);
            background: rgba(255, 209, 102, .06);
            border-color: rgba(255, 209, 102, .2);
            cursor: default;
        }

        #reportSection {
            display: none;
            max-width: 1100px;
            margin: 0 auto 60px;
            padding: 28px;
            color: #222;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
        }

        #reportSection h1 {
            margin-bottom: 18px;
            font-size: 1.5rem;
            text-align: left;
            color: #222;
            background: none;
            -webkit-text-fill-color: #222;
            filter: none;
        }

        #reportContent { padding: 10px 4px; color: #000; background: #ffffff; }
        #reportContent h4, #reportContent h5 { color: #000; }
        #reportContent p { margin-bottom: 10px; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, .3); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 209, 102, .25); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 209, 102, .45); }

        @media (max-width: 640px) {
            .container-fluid { padding: 24px 18px 32px; }
        }
    </style>
</head>

<body>
    <canvas id="bg-gl"></canvas>

    <div class="container-fluid">
        <h1>Форма листа данных ручного тестирования</h1>

        <form id="testForm">

            <div class="field-grid">
                <div class="field field-full">
                    <label for="product_name"><strong>Название продукта</strong></label>
                    <textarea class="form-control" id="product_name" name="product_name" rows="2" required></textarea>
                </div>
            </div>

            <div class="field-grid">
                <div class="field">
                    <label for="tc_start_date"><strong>Дата начала разработки тест-кейсов</strong></label>
                    <textarea class="form-control" id="tc_start_date" name="tc_start_date" rows="2"
                        placeholder="дд.мм.гггг" required></textarea>
                </div>
                <div class="field">
                    <label for="tc_execution_start_date"><strong>Дата начала выполнения тест-кейсов</strong></label>
                    <textarea class="form-control" id="tc_execution_start_date" name="tc_execution_start_date"
                        rows="2" placeholder="дд.мм.гггг" required></textarea>
                </div>
                <div class="field">
                    <label for="tc_end_date"><strong>Дата окончания разработки тест-кейсов</strong></label>
                    <textarea class="form-control" id="tc_end_date" name="tc_end_date" rows="2"
                        placeholder="дд.мм.гггг" required></textarea>
                </div>
                <div class="field">
                    <label for="tc_execution_end_date"><strong>Дата окончания выполнения тест-кейсов</strong></label>
                    <textarea class="form-control" id="tc_execution_end_date" name="tc_execution_end_date" rows="2"
                        placeholder="дд.мм.гггг" required></textarea>
                </div>

                <div class="field">
                    <label for="epic"><strong>Эпик</strong></label>
                    <textarea class="form-control" id="epic" name="epic" rows="2" required></textarea>
                </div>
                <div class="field">
                    <label for="developer_name"><strong>Имя разработчика</strong></label>
                    <textarea class="form-control" id="developer_name" name="developer_name" rows="2"
                        required></textarea>
                </div>

                <div class="field">
                    <label for="test_case_developed_by"><strong>Тест-кейсы разработал</strong></label>
                    <textarea class="form-control" id="test_case_developed_by" name="test_case_developed_by"
                        rows="2" required></textarea>
                </div>
                <div class="field">
                    <label for="test_case_reviewed_by"><strong>Тест-кейсы проверил</strong></label>
                    <textarea class="form-control" id="test_case_reviewed_by" name="test_case_reviewed_by" rows="2"
                        required></textarea>
                </div>

                <div class="field">
                    <label for="user_story"><strong>Пользовательская история</strong></label>
                    <textarea class="form-control" id="user_story" name="user_story" rows="3" required></textarea>
                </div>
                <div class="field">
                    <label for="test_scenario"><strong>Тестовый сценарий</strong></label>
                    <textarea class="form-control" id="test_scenario" name="test_scenario" rows="3"
                        required></textarea>
                </div>
            </div>

            <div class="field-grid">
                <div class="field field-full">
                    <label for="test_case_executed_by"><strong>Тестирование выполнил</strong></label>
                    <textarea class="form-control" id="test_case_executed_by" name="test_case_executed_by" rows="2"
                        required></textarea>
                </div>
            </div>

            <div class="table-toolbar">
                <button type="button" class="add-button" onclick="addRow()">+ Добавить тест-кейс</button>
                <button type="button" class="clear-button" onclick="clearAll()">Очистить форму</button>
            </div>

            <div class="table-responsive">
                <table class="summary-table" id="testCaseTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;">№</th>
                            <th style="min-width: 100px;">ID тест-кейса</th>
                            <th style="min-width: 110px;">Тип тестирования</th>
                            <th style="min-width: 100px;">Функция</th>
                            <th style="min-width: 120px;">Название тест-кейса</th>
                            <th style="min-width: 120px;">Ожидаемый результат</th>
                            <th style="min-width: 120px;">Фактический результат</th>
                            <th style="min-width: 100px;">Тестовые данные</th>
                            <th style="min-width: 160px;">Шаги воспроизведения</th>
                            <th style="min-width: 150px;">Скриншот бага</th>
                            <th style="min-width: 110px;">Итоговый статус</th>
                            <th style="width: 80px;">Действие</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Строки создаются динамически -->
                    </tbody>
                </table>
            </div>

            <h1>Подсчёт тест-кейсов</h1>
            <div class="counter-grid">
                <div class="field">
                    <label for="pass"><strong>Пройдено</strong></label>
                    <textarea class="form-control counter" id="pass" name="pass" rows="1" readonly>0</textarea>
                </div>
                <div class="field">
                    <label for="fail"><strong>Не пройдено</strong></label>
                    <textarea class="form-control counter" id="fail" name="fail" rows="1" readonly>0</textarea>
                </div>
                <div class="field">
                    <label for="not_executed"><strong>Не выполнено</strong></label>
                    <textarea class="form-control counter" id="not_executed" name="not_executed" rows="1"
                        readonly>0</textarea>
                </div>
                <div class="field">
                    <label for="out_of_scope"><strong>Вне области</strong></label>
                    <textarea class="form-control counter" id="out_of_scope" name="out_of_scope" rows="1"
                        readonly>0</textarea>
                </div>
                <div class="field">
                    <label for="total"><strong>Всего</strong></label>
                    <textarea class="form-control counter" id="total" name="total" rows="1" readonly>0</textarea>
                </div>
            </div>

            <input type="submit" class="btn btn-success" value="Сформировать отчёт">
        </form>
    </div>

    <div id="reportSection">
        <h1>Отчёт</h1>
        <div id="reportContent"></div>
        <button type="button" id="downloadBtn" class="btn-download">Скачать PDF</button>
    </div>

    <script>
        /* ============================================================
           КОНСТАНТЫ
        ============================================================ */
        const STORAGE_KEY = 'manualTestingDataSheet_v1';
        const MAX_IMAGE_PERSIST_BYTES = 600000; // ~600 КБ base64 на изображение

        const MAIN_FIELD_LABELS = [
            ['product_name', 'Название продукта'],
            ['tc_start_date', 'Дата начала разработки тест-кейсов'],
            ['tc_execution_start_date', 'Дата начала выполнения тест-кейсов'],
            ['tc_end_date', 'Дата окончания разработки тест-кейсов'],
            ['tc_execution_end_date', 'Дата окончания выполнения тест-кейсов'],
            ['epic', 'Эпик'],
            ['developer_name', 'Имя разработчика'],
            ['test_case_developed_by', 'Тест-кейсы разработал'],
            ['test_case_reviewed_by', 'Тест-кейсы проверил'],
            ['user_story', 'Пользовательская история'],
            ['test_scenario', 'Тестовый сценарий'],
            ['test_case_executed_by', 'Тестирование выполнил']
        ];

        const ROW_FIELD_LABELS = [
            ['testcase_id', 'ID тест-кейса'],
            ['type_of_testing', 'Тип тестирования'],
            ['features', 'Функция'],
            ['test_cases', 'Название тест-кейса'],
            ['expected_result', 'Ожидаемый результат'],
            ['actual_result', 'Фактический результат'],
            ['test_data', 'Тестовые данные'],
            ['reproducing_steps', 'Шаги воспроизведения'],
            ['bug_screenshot', 'Скриншот бага'],
            ['final_status', 'Итоговый статус']
        ];

        const STATUS_LABELS = {
            pass: 'Пройден',
            fail: 'Не пройден',
            not_executed: 'Не выполнен',
            out_of_scope: 'Вне области'
        };

        /* ============================================================
           HTML-экранирование
        ============================================================ */
        function escapeHtml(value) {
            return String(value === undefined || value === null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/\n/g, '<br>');
        }

        /* ============================================================
           СОХРАНЕНИЕ / ВОССТАНОВЛЕНИЕ (localStorage)
        ============================================================ */
        function saveData() {
            const data = { fields: {}, rows: [] };

            MAIN_FIELD_LABELS.forEach(function (pair) {
                const el = document.querySelector('[name="' + pair[0] + '"]');
                if (el) data.fields[pair[0]] = el.value;
            });

            document.querySelectorAll('#testCaseTable tbody tr').forEach(function (tr) {
                const row = {};
                tr.querySelectorAll('[data-field]').forEach(function (el) {
                    if (el.type === 'file') return;
                    row[el.dataset.field] = el.value;
                });
                row.screenshot_name = tr.dataset.screenshotName || '';

                /* Сохраняем только небольшие изображения, чтобы не превысить квоту localStorage */
                const dataUrl = tr.dataset.screenshotData || '';
                if (dataUrl && dataUrl.length < MAX_IMAGE_PERSIST_BYTES) {
                    row.screenshot_data = dataUrl;
                }

                data.rows.push(row);
            });

            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('Не удалось сохранить данные в localStorage:', e);
            }
        }

        function restoreData() {
            let raw = null;
            try {
                raw = localStorage.getItem(STORAGE_KEY);
            } catch (e) {
                return false;
            }
            if (!raw) return false;

            let data;
            try {
                data = JSON.parse(raw);
            } catch (e) {
                return false;
            }
            if (!data) return false;

            if (data.fields) {
                Object.keys(data.fields).forEach(function (name) {
                    const el = document.querySelector('[name="' + name + '"]');
                    if (el) el.value = data.fields[name];
                });
            }

            const tbody = document.querySelector('#testCaseTable tbody');
            tbody.innerHTML = '';
            if (Array.isArray(data.rows) && data.rows.length) {
                data.rows.forEach(function (rowData) {
                    tbody.appendChild(createRow(rowData));
                });
            } else {
                tbody.appendChild(createRow());
            }

            renumberRows();
            updateCounts();
            return true;
        }

        /* ============================================================
           ТАБЛИЦА ТЕСТ-КЕЙСОВ
        ============================================================ */
        function createRow(data) {
            data = data || {};

            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td class="row-number"></td>' +
                '<td><textarea class="form-control" data-field="testcase_id" rows="2" required></textarea></td>' +
                '<td><textarea class="form-control" data-field="type_of_testing" rows="2"></textarea></td>' +
                '<td><textarea class="form-control" data-field="features" rows="2"></textarea></td>' +
                '<td><textarea class="form-control" data-field="test_cases" rows="2"></textarea></td>' +
                '<td><textarea class="form-control" data-field="expected_result" rows="2"></textarea></td>' +
                '<td><textarea class="form-control" data-field="actual_result" rows="2"></textarea></td>' +
                '<td><textarea class="form-control" data-field="test_data" rows="2"></textarea></td>' +
                '<td><textarea class="form-control" data-field="reproducing_steps" rows="2"></textarea></td>' +
                '<td>' +
                '  <input type="file" class="form-control-file" data-field="bug_screenshot" accept="image/*">' +
                '  <small class="file-status"></small>' +
                '  <div class="screenshot-preview"></div>' +
                '</td>' +
                '<td>' +
                '  <select class="form-control" data-field="final_status">' +
                '    <option value="">Выберите статус</option>' +
                '    <option value="pass">Пройден</option>' +
                '    <option value="fail">Не пройден</option>' +
                '    <option value="not_executed">Не выполнен</option>' +
                '    <option value="out_of_scope">Вне области</option>' +
                '  </select>' +
                '</td>' +
                '<td><button type="button" class="btn remove-button" onclick="removeRow(this)">Удалить</button></td>';

            Object.keys(data).forEach(function (key) {
                if (key === 'screenshot_name' || key === 'screenshot_data') return;
                const el = tr.querySelector('[data-field="' + key + '"]');
                if (el && el.type !== 'file') el.value = data[key] || '';
            });

            const fileInput = tr.querySelector('[data-field="bug_screenshot"]');
            const fileStatus = tr.querySelector('.file-status');
            const preview = tr.querySelector('.screenshot-preview');

            function setPreview(dataUrl, name) {
                if (dataUrl) {
                    preview.innerHTML =
                        '<img src="' + dataUrl + '" alt="' + escapeHtml(name || 'Скриншот') + '">';
                } else {
                    preview.innerHTML = '';
                }
            }

            /* Восстановленные из localStorage данные */
            if (data.screenshot_data) {
                tr.dataset.screenshotData = data.screenshot_data;
                tr.dataset.screenshotName = data.screenshot_name || '';
                fileStatus.textContent = '✔ Файл успешно загружен: ' +
                    (data.screenshot_name || 'изображение');
                setPreview(data.screenshot_data, data.screenshot_name);
            } else if (data.screenshot_name) {
                tr.dataset.screenshotName = data.screenshot_name;
                fileStatus.textContent = 'Ранее выбранный файл: ' + data.screenshot_name +
                    ' (выберите заново, чтобы показать в отчёте)';
            }

            /* Чтение файла в Data URL — именно это делает скриншот видимым в отчёте */
            fileInput.addEventListener('change', function () {
                if (this.files && this.files.length > 0) {
                    const file = this.files[0];
                    const name = file.name;

                    tr.dataset.screenshotName = name;
                    fileStatus.textContent = '⏳ Чтение файла: ' + name;

                    const reader = new FileReader();
                    reader.onload = function (ev) {
                        const dataUrl = ev.target.result;
                        tr.dataset.screenshotData = dataUrl;
                        fileStatus.textContent = '✔ Файл успешно загружен: ' + name;
                        setPreview(dataUrl, name);
                        saveData();
                    };
                    reader.onerror = function () {
                        fileStatus.textContent = '⚠ Не удалось прочитать файл: ' + name;
                    };
                    reader.readAsDataURL(file);
                } else {
                    delete tr.dataset.screenshotName;
                    delete tr.dataset.screenshotData;
                    fileStatus.textContent = '';
                    setPreview('', '');
                }
            });

            tr.querySelector('[data-field="final_status"]').addEventListener('change', function () {
                updateCounts();
            });

            return tr;
        }

        function addRow(data) {
            const tbody = document.querySelector('#testCaseTable tbody');
            tbody.appendChild(createRow(data));
            renumberRows();
            updateCounts();
            saveData();
        }

        function removeRow(button) {
            const row = button.parentNode.parentNode;
            const tbody = row.parentNode;
            if (tbody.querySelectorAll('tr').length <= 1) {
                alert('Нельзя удалить единственный тест-кейс.');
                return;
            }
            row.parentNode.removeChild(row);
            renumberRows();
            updateCounts();
            saveData();
        }

        function renumberRows() {
            const rows = document.querySelectorAll('#testCaseTable tbody tr');
            rows.forEach(function (tr, index) {
                tr.querySelector('.row-number').textContent = index + 1;
            });
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const rows = document.querySelectorAll('#testCaseTable tbody tr');
            const disable = rows.length <= 1;
            rows.forEach(function (tr) {
                const btn = tr.querySelector('.remove-button');
                if (btn) {
                    btn.disabled = disable;
                    btn.title = disable ? 'Нельзя удалить единственный тест-кейс' : '';
                }
            });
        }

        function updateCounts() {
            let passCount = 0;
            let failCount = 0;
            let notExecutedCount = 0;
            let outOfScopeCount = 0;

            document.querySelectorAll('#testCaseTable tbody tr').forEach(function (tr) {
                const status = tr.querySelector('[data-field="final_status"]').value;
                if (status === 'pass') passCount++;
                else if (status === 'fail') failCount++;
                else if (status === 'not_executed') notExecutedCount++;
                else if (status === 'out_of_scope') outOfScopeCount++;
            });

            document.querySelector('[name="pass"]').value = passCount;
            document.querySelector('[name="fail"]').value = failCount;
            document.querySelector('[name="not_executed"]').value = notExecutedCount;
            document.querySelector('[name="out_of_scope"]').value = outOfScopeCount;
            document.querySelector('[name="total"]').value =
                passCount + failCount + notExecutedCount + outOfScopeCount;
        }

        /* ============================================================
           ФОРМИРОВАНИЕ ОТЧЁТА
        ============================================================ */
        function buildReport() {
            let html = '<h4>Отчёт по форме ручного тестирования</h4>';
            html += '<p><strong>Дата формирования:</strong> ' +
                escapeHtml(new Date().toLocaleString('ru-RU')) + '</p>';

            MAIN_FIELD_LABELS.forEach(function (pair) {
                const el = document.querySelector('[name="' + pair[0] + '"]');
                const value = el ? el.value : '';
                html += '<p><strong>' + pair[1] + ':</strong> ' +
                    (value ? escapeHtml(value) : '—') + '</p>';
            });

            html += '<h5>Тест-кейсы</h5>';

            const rows = document.querySelectorAll('#testCaseTable tbody tr');
            if (!rows.length) {
                html += '<p>Тест-кейсы не добавлены.</p>';
            }

            rows.forEach(function (tr, index) {
                html += '<p><strong>Тест-кейс №' + (index + 1) + '</strong><br>';

                ROW_FIELD_LABELS.forEach(function (pair) {
                    const field = pair[0];
                    const label = pair[1];

                    /* --- Скриншот бага: вставляем реальное изображение --- */
                    if (field === 'bug_screenshot') {
                        const dataUrl = tr.dataset.screenshotData || '';
                        const name = tr.dataset.screenshotName || '';

                        if (dataUrl) {
                            html += '<strong>' + label + ':</strong>' +
                                (name ? ' ' + escapeHtml(name) : '') +
                                '<br><img src="' + dataUrl + '" alt="Скриншот бага" ' +
                                'style="display:block;max-width:100%;max-height:420px;' +
                                'margin:6px 0 10px;border:1px solid #ccc;border-radius:8px;">';
                        } else if (name) {
                            html += '<strong>' + label + ':</strong> ' + escapeHtml(name) +
                                ' <em>(изображение недоступно — выберите файл заново)</em><br>';
                        } else {
                            html += '<strong>' + label + ':</strong> —<br>';
                        }
                        return;
                    }

                    let value = '';
                    if (field === 'final_status') {
                        const raw = tr.querySelector('[data-field="final_status"]').value;
                        value = STATUS_LABELS[raw] || '';
                    } else {
                        const el = tr.querySelector('[data-field="' + field + '"]');
                        value = el ? el.value : '';
                    }

                    html += '<strong>' + label + ':</strong> ' +
                        (value ? escapeHtml(value) : '—') + '<br>';
                });

                html += '</p>';
            });

            html += '<h5>Итоги</h5>';
            html += '<p>' +
                '<strong>Пройдено:</strong> ' + document.querySelector('[name="pass"]').value + '; ' +
                '<strong>Не пройдено:</strong> ' + document.querySelector('[name="fail"]').value + '; ' +
                '<strong>Не выполнено:</strong> ' + document.querySelector('[name="not_executed"]').value + '; ' +
                '<strong>Вне области:</strong> ' + document.querySelector('[name="out_of_scope"]').value + '; ' +
                '<strong>Всего:</strong> ' + document.querySelector('[name="total"]').value +
                '</p>';

            return html;
        }

        /* ============================================================
           ЭКСПОРТ В PDF (через canvas — кириллица и картинки сохраняются)
        ============================================================ */
        function downloadPDF() {
            const reportEl = document.getElementById('reportContent');
            const btn = document.getElementById('downloadBtn');

            if (!reportEl.innerHTML.trim()) {
                alert('Сначала сформируйте отчёт.');
                return;
            }

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'Формирование PDF...';

            html2canvas(reportEl, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                allowTaint: false,
                imageTimeout: 15000
            }).then(function (canvas) {
                const jsPDFCtor = window.jspdf.jsPDF;
                const pdf = new jsPDFCtor('p', 'mm', 'a4');

                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();
                const margin = 10;

                const imgWidth = pageWidth - margin * 2;
                const imgHeight = canvas.height * imgWidth / canvas.width;
                const imgData = canvas.toDataURL('image/jpeg', 0.95);

                let heightLeft = imgHeight;
                let position = margin;

                pdf.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
                heightLeft -= (pageHeight - margin * 2);

                while (heightLeft > 0) {
                    position -= (pageHeight - margin * 2);
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
                    heightLeft -= (pageHeight - margin * 2);
                }

                pdf.save('otchet_po_testirovaniyu.pdf');
            }).catch(function (err) {
                console.error(err);
                alert('Не удалось сформировать PDF. Попробуйте ещё раз.');
            }).finally(function () {
                btn.disabled = false;
                btn.textContent = originalText;
            });
        }

        /* ============================================================
           ОЧИСТКА
        ============================================================ */
        function clearAll() {
            if (!confirm('Удалить все введённые данные и сохранённый черновик?')) return;

            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) { /* игнорируем */ }

            document.getElementById('testForm').reset();
            document.querySelector('#testCaseTable tbody').innerHTML = '';
            document.getElementById('reportContent').innerHTML = '';
            document.getElementById('reportSection').style.display = 'none';

            addRow();
        }

        /* ============================================================
           ИНИЦИАЛИЗАЦИЯ ФОРМЫ
        ============================================================ */
        (function initForm() {
            const form = document.getElementById('testForm');

            /* input — дебаунс, чтобы не сериализовать base64 на каждое нажатие */
            let saveTimer = null;
            form.addEventListener('input', function () {
                if (saveTimer) clearTimeout(saveTimer);
                saveTimer = setTimeout(saveData, 250);
            });

            /* change — сохраняем сразу (файлы, select) */
            form.addEventListener('change', saveData);

            form.addEventListener('submit', function (event) {
                event.preventDefault();

                document.getElementById('reportContent').innerHTML = buildReport();

                const section = document.getElementById('reportSection');
                section.style.display = 'block';
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });

            document.getElementById('downloadBtn').addEventListener('click', downloadPDF);

            if (!restoreData()) {
                addRow();
            }
        })();

        /* ============================================================
           WEBGL ФОН (тлеющие угли)
        ============================================================ */
        (function initBackground() {
            const canvas = document.getElementById('bg-gl');
            if (!canvas) return;

            const gl = canvas.getContext('webgl', {
                alpha: false,
                antialias: false,
                depth: false,
                stencil: false,
                powerPreference: 'low-power'
            }) || canvas.getContext('experimental-webgl');

            if (!gl) {
                canvas.style.display = 'none';
                return;
            }

            const vertexSrc = `
                attribute vec2 a_pos;
                void main() {
                    gl_Position = vec4(a_pos, 0.0, 1.0);
                }
            `;

            const fragmentSrc = `
                precision mediump float;
                uniform float u_time;
                uniform vec2 u_resolution;

                float hash(vec2 p) {
                    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
                }

                float noise(vec2 p) {
                    vec2 i = floor(p);
                    vec2 f = fract(p);
                    vec2 u = f * f * (3.0 - 2.0 * f);
                    return mix(
                        mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                        mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
                        u.y
                    );
                }

                float fbm(vec2 p) {
                    float v = 0.0;
                    float a = 0.5;
                    for (int i = 0; i < 5; i++) {
                        v += a * noise(p);
                        p *= 2.02;
                        a *= 0.5;
                    }
                    return v;
                }

                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                    vec2 p = uv;
                    p.x *= u_resolution.x / u_resolution.y;

                    float t = u_time * 0.05;

                    float n1 = fbm(p * 2.2 + vec2(t, -t * 0.7));
                    float n2 = fbm(p * 3.4 + vec2(-t * 0.6, t * 0.4) + n1);
                    float n3 = fbm(p * 1.2 + vec2(t * 0.3, t * 0.2));

                    vec3 cBase  = vec3(0.055, 0.035, 0.022);
                    vec3 cEmber = vec3(0.36, 0.11, 0.035);
                    vec3 cAmber = vec3(0.58, 0.34, 0.07);
                    vec3 cRed   = vec3(0.34, 0.05, 0.05);

                    vec3 col = mix(cBase, cEmber, smoothstep(0.20, 0.92, n1));
                    col = mix(col, cAmber, smoothstep(0.55, 1.00, n2) * 0.35);
                    col = mix(col, cRed,   smoothstep(0.30, 0.90, n3) * 0.50);

                    vec2 v = uv - 0.5;
                    float vig = smoothstep(0.95, 0.25, length(v));
                    col *= vig;

                    float g = hash(gl_FragCoord.xy + u_time) * 0.03;
                    col += g - 0.015;

                    gl_FragColor = vec4(col, 1.0);
                }
            `;

            function compile(type, src) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, src);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.warn('Shader error:', gl.getShaderInfoLog(shader));
                    return null;
                }
                return shader;
            }

            const vs = compile(gl.VERTEX_SHADER, vertexSrc);
            const fs = compile(gl.FRAGMENT_SHADER, fragmentSrc);
            if (!vs || !fs) { canvas.style.display = 'none'; return; }

            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);

            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.warn('Program link error:', gl.getProgramInfoLog(program));
                canvas.style.display = 'none';
                return;
            }

            gl.useProgram(program);

            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(
                gl.ARRAY_BUFFER,
                new Float32Array([-1, -1, 3, -1, -1, 3]),
                gl.STATIC_DRAW
            );

            const aPos = gl.getAttribLocation(program, 'a_pos');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

            const uTime = gl.getUniformLocation(program, 'u_time');
            const uRes = gl.getUniformLocation(program, 'u_resolution');

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                const w = Math.floor(window.innerWidth * dpr);
                const h = Math.floor(window.innerHeight * dpr);
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                    gl.viewport(0, 0, w, h);
                }
            }

            resize();
            window.addEventListener('resize', resize, { passive: true });

            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const startTime = performance.now();
            let rafId = 0;

            function frame(now) {
                resize();
                const elapsed = (now - startTime) / 1000;
                gl.uniform1f(uTime, elapsed);
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
                if (!reducedMotion) {
                    rafId = requestAnimationFrame(frame);
                }
            }

            rafId = requestAnimationFrame(frame);

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    cancelAnimationFrame(rafId);
                } else if (!reducedMotion) {
                    rafId = requestAnimationFrame(frame);
                }
            });
        })();
    </script>
